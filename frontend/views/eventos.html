<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVORIA | Eventos</title>
  <link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="dashboard-body">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <h2>EVORIA</h2>
      </div>
      <nav>
        <a href="index.php?page=dashboard" class="nav-link">Dashboard</a>
        <a href="index.php?page=eventos" class="nav-link active">Eventos</a>
        <a href="index.php?page=recursos" class="nav-link">Recursos</a>
        <a href="index.php?page=inventario" class="nav-link">Inventario</a>
        <a href="index.php?page=cronograma" class="nav-link">Cronograma</a>
        <a href="index.php?page=presupuestos" class="nav-link">Presupuestos</a>
        <a href="index.php?page=alertas" class="nav-link">Alertas</a>
        <a href="index.php?page=reportes" class="nav-link">Reportes</a>
        <a href="index.php?page=auditoria" class="nav-link">Auditoría</a>
      </nav>
      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <h3>Eventos</h3>
        <div class="user-pill">Bienvenido, <span id="userName">Usuario</span></div>
      </header>

      <section class="toolbar">
        <a href="index.php?page=evento_nuevo" class="primary-btn">Crear evento</a>
      </section>

      <section class="panel">
        <h4>Listado de eventos</h4>
        <div id="eventsTableContainer" class="table-wrap"></div>
      </section>
    </main>
  </div>

  <script src="frontend/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('eventsTableContainer');
      if (!container) return;

      fetch('backend/routes/api.php?route=eventos')
        .then((res) => res.json())
        .then((result) => {
          if (!result.success) {
            container.innerHTML = '<p>No se pudieron cargar los eventos.</p>';
            return;
          }

          const events = result.data || [];
          if (!events.length) {
            container.innerHTML = '<p>No hay eventos registrados.</p>';
            return;
          }

          container.innerHTML = `
            <table class="data-table">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Tipo</th>
                  <th>Fecha Inicio</th>
                  <th>Fecha Fin</th>
                  <th>Estado</th>
                  <th>Responsable</th>
                </tr>
              </thead>
              <tbody>
                ${events.map((event) => `
                  <tr>
                    <td>${event.nombre || '-'}</td>
                    <td>${event.tipo || '-'}</td>
                    <td>${event.fecha_inicio || '-'}</td>
                    <td>${event.fecha_fin || '-'}</td>
                    <td>${event.estado || '-'}</td>
                    <td>${event.responsable_name || '-'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          `;
        })
        .catch(() => {
          container.innerHTML = '<p>Error al consultar la API.</p>';
        });
    });
  </script>
</body>
</html>
