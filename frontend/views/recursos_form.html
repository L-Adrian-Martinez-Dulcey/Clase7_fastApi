<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVORIA | Nuevo recurso</title>
  <link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="dashboard-body">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand"><h2>EVORIA</h2></div>
      <nav>
        <a href="index.php?page=dashboard">Dashboard</a>
        <a href="index.php?page=eventos">Eventos</a>
        <a href="index.php?page=recursos">Recursos</a>
        <a href="index.php?page=inventario">Inventario</a>
      </nav>
      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <h3>Nuevo recurso</h3>
        <div class="user-pill">Bienvenido, <span id="userName">Usuario</span></div>
      </header>

      <section class="panel">
        <form id="resourceForm" class="form-grid">
          <div>
            <label>Nombre<input name="nombre" type="text" required></label>
          </div>
          <div>
            <label>Tipo<input name="tipo" type="text" required></label>
          </div>
          <div>
            <label>Costo<input name="costo" type="number" min="0" step="0.01" value="0"></label>
          </div>
          <div>
            <label>Cantidad total<input name="cantidad_total" type="number" min="0" step="1" value="0"></label>
          </div>
          <div>
            <label>Disponibilidad<select name="disponibilidad"><option value="disponible">Disponible</option><option value="ocupado">Ocupado</option><option value="mantenimiento">Mantenimiento</option><option value="inactivo">Inactivo</option></select></label>
          </div>
          <div>
            <label>Estado<select name="estado"><option value="activo">Activo</option><option value="inactivo">Inactivo</option></select></label>
          </div>
          <div class="full">
            <label>Descripción<textarea name="descripcion" rows="3"></textarea></label>
          </div>
          <div class="full">
            <button type="submit" class="primary-btn">Guardar recurso</button>
          </div>
        </form>
        <div id="resourceFormMessage" class="inline-message"></div>
      </section>
    </main>
  </div>

  <script src="frontend/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('resourceForm');
      const messageEl = document.getElementById('resourceFormMessage');
      if (!form) return;

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        try {
          const response = await fetch('backend/routes/api.php?route=recursos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok || !result.success) {
            messageEl.className = 'inline-message error';
            messageEl.textContent = result.message || 'Error al crear el recurso.';
            return;
          }

          messageEl.className = 'inline-message success';
          messageEl.textContent = result.message || 'Recurso creado correctamente.';
          form.reset();
        } catch (error) {
          messageEl.className = 'inline-message error';
          messageEl.textContent = 'No se pudo conectar con la API.';
        }
      });
    });
  </script>
</body>
</html>
