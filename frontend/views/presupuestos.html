<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuestos - EVORIA</title>
  <link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="dashboard-body">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand"><h2>EVORIA</h2></div>
      <nav>
        <a href="index.php?page=dashboard" class="nav-link">Dashboard</a>
        <a href="index.php?page=eventos" class="nav-link">Eventos</a>
        <a href="index.php?page=recursos" class="nav-link">Recursos</a>
        <a href="index.php?page=inventario" class="nav-link">Inventario</a>
        <a href="index.php?page=cronograma" class="nav-link">Cronograma</a>
        <a href="index.php?page=presupuestos" class="nav-link active">Presupuestos</a>
        <a href="index.php?page=alertas" class="nav-link">Alertas</a>
        <a href="index.php?page=reportes" class="nav-link">Reportes</a>
        <a href="index.php?page=auditoria" class="nav-link">Auditoría</a>
      </nav>
      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </aside>

    <main class="main-panel">
      <header class="topbar"><h3>Presupuestos</h3><div class="user-pill">Bienvenido, <span id="userName">Usuario</span></div></header>

      <section class="panel">
        <h4>Registrar presupuesto</h4>
        <form id="budgetForm" class="form-grid">
          <div class="full"><label>Evento<select id="budgetEvent" name="evento_id" required><option value="">Cargando eventos...</option></select></label></div>
          <div><label>Subtotal de recursos<input id="resourceSubtotal" name="subtotal_recursos" type="number" min="0" step="0.01" value="0" required></label></div>
          <div><label>Costos adicionales<input id="additionalCosts" name="costos_adicionales" type="number" min="0" step="0.01" value="0" required></label></div>
          <div><label>Moneda<select name="moneda"><option value="COP">COP</option><option value="USD">USD</option><option value="CLP">CLP</option></select></label></div>
          <div><label>Total calculado<input id="budgetTotal" type="text" readonly value="$ 0"></label></div>
          <div class="full"><button type="submit" class="primary-btn">Guardar presupuesto</button></div>
        </form>
        <div id="budgetMessage" class="inline-message"></div>
      </section>

      <section class="panel">
        <h4>Presupuestos por evento</h4>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Evento</th><th>Subtotal recursos</th><th>Costos adicionales</th><th>Total</th><th>Moneda</th></tr></thead><tbody id="budgetTable"><tr><td colspan="6">Cargando presupuestos...</td></tr></tbody></table></div>
      </section>
    </main>
  </div>

  <script src="frontend/js/app.js"></script>
  <script>
    const api = 'backend/routes/api.php?route=';
    const money = value => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 2 }).format(Number(value || 0));

    document.addEventListener('DOMContentLoaded', () => {
      loadEvents(); loadBudgets();
      document.getElementById('budgetForm').addEventListener('submit', saveBudget);
      ['resourceSubtotal', 'additionalCosts'].forEach(id => document.getElementById(id).addEventListener('input', updateTotal));
    });

    async function loadEvents() {
      const select = document.getElementById('budgetEvent');
      try {
        const response = await fetch(api + 'eventos'); const result = await response.json();
        if (!response.ok || !result.success) throw new Error();
        select.replaceChildren(new Option('Selecciona un evento', ''));
        result.data.forEach(event => select.add(new Option(`${event.nombre} (${event.fecha_inicio})`, event.id)));
        if (!result.data.length) select.add(new Option('No hay eventos registrados', ''));
      } catch { select.replaceChildren(new Option('No se pudieron cargar los eventos', '')); }
    }

    function updateTotal() {
      const subtotal = Number(document.getElementById('resourceSubtotal').value) || 0;
      const additional = Number(document.getElementById('additionalCosts').value) || 0;
      document.getElementById('budgetTotal').value = money(subtotal + additional);
    }

    async function saveBudget(event) {
      event.preventDefault(); const form = event.currentTarget, message = document.getElementById('budgetMessage');
      try {
        const response = await fetch(api + 'presupuestos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form).entries())) });
        const result = await response.json(); if (!response.ok || !result.success) throw new Error(result.message || 'No se pudo guardar el presupuesto.');
        message.className = 'inline-message success'; message.textContent = result.message; form.reset(); updateTotal(); loadBudgets();
      } catch (error) { message.className = 'inline-message error'; message.textContent = error.message || 'No se pudo guardar el presupuesto.'; }
    }

    function cell(value) { const td = document.createElement('td'); td.textContent = value; return td; }
    async function loadBudgets() {
      const tbody = document.getElementById('budgetTable');
      try {
        const response = await fetch(api + 'presupuestos'); const result = await response.json(); if (!response.ok || !result.success) throw new Error();
        tbody.replaceChildren();
        if (!result.data.length) { const row = document.createElement('tr'), item = cell('Aún no hay presupuestos registrados.'); item.colSpan = 6; item.style.textAlign = 'center'; row.append(item); tbody.append(row); return; }
        result.data.forEach(budget => { const row = document.createElement('tr'); [budget.id, budget.evento_nombre, money(budget.subtotal_recursos), money(budget.costos_adicionales), money(budget.total), budget.moneda].forEach(value => row.append(cell(value))); tbody.append(row); });
      } catch { tbody.replaceChildren(); const row = document.createElement('tr'), item = cell('No se pudieron cargar los presupuestos.'); item.colSpan = 6; item.style.textAlign = 'center'; row.append(item); tbody.append(row); }
    }
  </script>
</body>
</html>
